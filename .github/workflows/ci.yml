name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      JWT_SECRET: ci-only-jwt-secret-0123456789-0123456789
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/agent_db
      REDIS_URL: redis://localhost:6379/0
      LANGFUSE_ENABLED: "false"
      MEMORY_PERSISTENCE: "false"
      REQUEST_LOG_ENABLED: "false"
      AUTO_MIGRATE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e backend --no-deps

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  admin-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install admin frontend
        working-directory: admin-frontend
        run: npm ci

      - name: Build admin frontend
        working-directory: admin-frontend
        run: npm run build
